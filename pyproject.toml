[project]
name = "group-7-capstone"
version = "0.1.0"
description = "Group 7: Automated Traffic Enforcement in NYC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "duckdb",
    "requests",
    "python-dotenv",
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "sodapy",
    "tqdm>=4.70.1",
    "openpyxl>=3.1.5",
    "statsmodels>=0.15.0",
    "plotly>=7.1.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "shapely==2.1.2",
    "pyproj==3.8.0",
    "pyogrio==0.13.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "jupyterlab",
    "ruff",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "nbconvert==7.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
